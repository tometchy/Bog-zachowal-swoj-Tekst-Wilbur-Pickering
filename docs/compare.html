<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Porównanie wydania angielskiego i polskiego</title>
  <style>
    :root {
      color-scheme: light;
      --background: #f4f1ea;
      --surface: #fffdf8;
      --text: #24221f;
      --muted: #6c665d;
      --border: #d6d0c5;
      --accent: #315b4b;
      --accent-hover: #244538;
      --shadow: 0 8px 24px rgb(53 47 38 / 10%);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      color: var(--text);
      background: var(--background);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: .8rem clamp(.75rem, 2vw, 1.5rem);
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      box-shadow: 0 2px 12px rgb(53 47 38 / 7%);
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(1.1rem, 2vw, 1.45rem);
      line-height: 1.2;
    }

    .subtitle {
      margin: .2rem 0 0;
      color: var(--muted);
      font-size: .82rem;
    }

    .layout-switcher {
      display: flex;
      flex: 0 0 auto;
      gap: .35rem;
      padding: .25rem;
      border: 1px solid var(--border);
      border-radius: .65rem;
      background: var(--background);
    }

    button, input { font: inherit; }

    button {
      min-height: 2.3rem;
      padding: .45rem .7rem;
      border: 1px solid transparent;
      border-radius: .45rem;
      color: var(--text);
      background: transparent;
      cursor: pointer;
    }

    button:hover { background: rgb(49 91 75 / 10%); }
    button[aria-pressed="true"], .page-controls button {
      color: white;
      background: var(--accent);
    }
    button[aria-pressed="true"]:hover, .page-controls button:hover { background: var(--accent-hover); }
    button:focus-visible, input:focus-visible { outline: 3px solid rgb(49 91 75 / 35%); outline-offset: 2px; }

    main {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 1rem;
      padding: 1rem;
    }

    main.stacked { grid-template-columns: minmax(0, 1fr); }

    .document {
      min-width: 0;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: .8rem;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .document-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: .65rem;
      padding: .7rem .8rem;
      border-bottom: 1px solid var(--border);
    }

    h2 { margin: 0; font-size: 1rem; }

    .page-controls { display: flex; align-items: center; gap: .35rem; }
    .page-controls button { min-width: 2.3rem; padding-inline: .55rem; font-weight: 700; }
    .page-controls label { color: var(--muted); font-size: .85rem; }
    .page-controls input {
      width: 4.25rem;
      height: 2.3rem;
      padding: .35rem;
      border: 1px solid var(--border);
      border-radius: .4rem;
      color: var(--text);
      background: var(--surface);
      text-align: center;
    }

    .viewer {
      display: block;
      position: relative;
      width: 100%;
      height: calc(100vh - 9.2rem);
      min-height: 32rem;
      overflow: auto;
      padding: 1rem;
      background: #525659;
      text-align: center;
    }

    .viewer canvas {
      display: block;
      max-width: 100%;
      margin: 0 auto;
      background: white;
      box-shadow: 0 3px 14px rgb(0 0 0 / 35%);
    }

    .viewer-status {
      position: absolute;
      inset: 50% auto auto 50%;
      margin: 0;
      padding: .65rem .85rem;
      border-radius: .45rem;
      color: white;
      background: rgb(25 27 28 / 88%);
      transform: translate(-50%, -50%);
    }

    .viewer-status[hidden] { display: none; }
    main.stacked .viewer { height: 80vh; }

    @media (max-width: 760px) {
      header { align-items: flex-start; flex-direction: column; }
      .layout-switcher { width: 100%; }
      .layout-switcher button { flex: 1; }
      main { grid-template-columns: minmax(0, 1fr); padding: .65rem; }
      .viewer { height: 72vh; min-height: 25rem; padding: .5rem; }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Porównanie tekstów</h1>
      <p class="subtitle">Numery stron i układ są zapamiętywane w tej przeglądarce.</p>
    </div>
    <div class="layout-switcher" role="group" aria-label="Układ dokumentów">
      <button id="side-by-side" type="button" aria-pressed="true">Obok siebie</button>
      <button id="top-and-bottom" type="button" aria-pressed="false">Jeden pod drugim</button>
    </div>
  </header>

  <main id="documents">
    <section class="document" data-document="english">
      <div class="document-header">
        <h2>Oryginał angielski</h2>
        <div class="page-controls">
          <button class="previous" type="button" aria-label="Poprzednia strona dokumentu angielskiego">−</button>
          <label>Strona <input class="page" type="number" min="1" step="1" inputmode="numeric" aria-label="Numer strony dokumentu angielskiego"></label>
          <button class="next" type="button" aria-label="Następna strona dokumentu angielskiego">+</button>
        </div>
      </div>
      <div class="viewer" role="region" aria-label="Angielskie wydanie książki">
        <canvas aria-label="Bieżąca strona angielskiego wydania"></canvas>
        <p class="viewer-status" role="status">Wczytywanie dokumentu…</p>
      </div>
    </section>

    <section class="document" data-document="polish">
      <div class="document-header">
        <h2>Tłumaczenie polskie</h2>
        <div class="page-controls">
          <button class="previous" type="button" aria-label="Poprzednia strona dokumentu polskiego">−</button>
          <label>Strona <input class="page" type="number" min="1" step="1" inputmode="numeric" aria-label="Numer strony dokumentu polskiego"></label>
          <button class="next" type="button" aria-label="Następna strona dokumentu polskiego">+</button>
        </div>
      </div>
      <div class="viewer" role="region" aria-label="Polskie wydanie książki">
        <canvas aria-label="Bieżąca strona polskiego wydania"></canvas>
        <p class="viewer-status" role="status">Wczytywanie dokumentu…</p>
      </div>
    </section>
  </main>

  <script type="module">
    import * as pdfjsLib from "./vendor/pdfjs/pdf.min.mjs";

    pdfjsLib.GlobalWorkerOptions.workerSrc = "./vendor/pdfjs/pdf.worker.min.mjs";

    const repositoryRawUrl = "https://raw.githubusercontent.com/tometchy/Bog-zachowal-swoj-Tekst-Wilbur-Pickering/master/";
    const documents = {
      english: repositoryRawUrl + "God-Has-Preserved-His-Text-4th.pdf",
      polish: repositoryRawUrl + "build/pdf/Bog-zachowal-swoj-Tekst-Wilbur-Pickering.pdf"
    };
    const storagePrefix = "pdf-comparison:";

    function savedValue(key, fallback) {
      try { return localStorage.getItem(storagePrefix + key) || fallback; }
      catch (_) { return fallback; }
    }

    function saveValue(key, value) {
      try { localStorage.setItem(storagePrefix + key, value); }
      catch (_) { /* Porównywarka działa również przy wyłączonym localStorage. */ }
    }

    document.querySelectorAll(".document").forEach(async (panel) => {
      const name = panel.dataset.document;
      const input = panel.querySelector(".page");
      const viewer = panel.querySelector(".viewer");
      const canvas = panel.querySelector("canvas");
      const status = panel.querySelector(".viewer-status");
      const previous = panel.querySelector(".previous");
      const next = panel.querySelector(".next");
      let pdf;
      let renderedPage = 1;
      let renderTask;
      let resizeTimer;

      async function renderPage(pageNumber) {
        if (!pdf) return;
        if (renderTask) renderTask.cancel();

        const page = await pdf.getPage(pageNumber);
        const unscaledViewport = page.getViewport({ scale: 1 });
        const availableWidth = Math.max(200, viewer.clientWidth - 32);
        const cssScale = availableWidth / unscaledViewport.width;
        const pixelRatio = window.devicePixelRatio || 1;
        const viewport = page.getViewport({ scale: cssScale * pixelRatio });

        canvas.width = Math.floor(viewport.width);
        canvas.height = Math.floor(viewport.height);
        canvas.style.width = Math.floor(viewport.width / pixelRatio) + "px";
        canvas.style.height = Math.floor(viewport.height / pixelRatio) + "px";

        renderTask = page.render({ canvasContext: canvas.getContext("2d"), viewport });
        try {
          await renderTask.promise;
          renderedPage = pageNumber;
          status.hidden = true;
        } catch (error) {
          if (error?.name !== "RenderingCancelledException") throw error;
        } finally {
          renderTask = null;
        }
      }

      function showPage(value) {
        const lastPage = pdf?.numPages || Number.MAX_SAFE_INTEGER;
        const page = Math.min(lastPage, Math.max(1, Math.floor(Number(value) || 1)));
        input.value = page;
        saveValue(name + ":page", String(page));
        previous.disabled = page === 1;
        next.disabled = pdf ? page === pdf.numPages : false;
        renderPage(page).catch(showError);
      }

      function showError(error) {
        console.error(error);
        status.hidden = false;
        status.textContent = "Nie udało się wczytać PDF-u. Sprawdź połączenie z internetem i odśwież stronę.";
      }

      previous.addEventListener("click", () => showPage(Number(input.value) - 1));
      next.addEventListener("click", () => showPage(Number(input.value) + 1));
      input.addEventListener("change", () => showPage(input.value));
      input.addEventListener("keydown", (event) => {
        if (event.key === "Enter") showPage(input.value);
      });

      try {
        pdf = await pdfjsLib.getDocument(documents[name]).promise;
        input.max = pdf.numPages;
        showPage(savedValue(name + ":page", "1"));

        new ResizeObserver(() => {
          clearTimeout(resizeTimer);
          resizeTimer = setTimeout(() => renderPage(renderedPage).catch(showError), 150);
        }).observe(viewer);
      } catch (error) {
        showError(error);
      }
    });

    const main = document.querySelector("main");
    const sideBySide = document.querySelector("#side-by-side");
    const topAndBottom = document.querySelector("#top-and-bottom");

    function setLayout(layout) {
      const stacked = layout === "stacked";
      main.classList.toggle("stacked", stacked);
      sideBySide.setAttribute("aria-pressed", String(!stacked));
      topAndBottom.setAttribute("aria-pressed", String(stacked));
      saveValue("layout", stacked ? "stacked" : "side-by-side");
    }

    sideBySide.addEventListener("click", () => setLayout("side-by-side"));
    topAndBottom.addEventListener("click", () => setLayout("stacked"));
    setLayout(savedValue("layout", "side-by-side"));
  </script>
</body>
</html>
