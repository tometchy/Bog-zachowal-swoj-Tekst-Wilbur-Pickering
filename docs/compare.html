<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="images/compare-favicon.svg" type="image/svg+xml">
  <title>Porównanie wydania angielskiego i polskiego</title>
  <style>
    :root {
      color-scheme: light;
      --background: #f4f1ea;
      --surface: #fffdf8;
      --text: #24221f;
      --muted: #6c665d;
      --border: #d6d0c5;
      --accent: #315b4b;
      --accent-hover: #244538;
      --shadow: 0 8px 24px rgb(53 47 38 / 10%);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-width: 320px;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      color: var(--text);
      background: var(--background);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    button, input { font: inherit; }

    button {
      min-width: 2.5rem;
      min-height: 2.5rem;
      padding: .35rem .65rem;
      border: 1px solid transparent;
      border-radius: .45rem;
      color: var(--text);
      background: transparent;
      cursor: pointer;
    }

    button:hover { background: rgb(49 91 75 / 10%); }
    button[aria-pressed="true"], .page-controls button {
      color: white;
      background: var(--accent);
    }
    button[aria-pressed="true"]:hover, .page-controls button:hover { background: var(--accent-hover); }
    button:focus-visible, input:focus-visible { outline: 3px solid rgb(49 91 75 / 35%); outline-offset: 2px; }

    main {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      grid-template-rows: minmax(0, 1fr);
      gap: .4rem;
      height: 100vh;
      height: 100dvh;
      padding: .4rem;
    }

    main.stacked {
      grid-template-columns: minmax(0, 1fr);
      grid-template-rows: repeat(2, minmax(0, 1fr));
    }

    .document {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: .8rem;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .document-header {
      display: flex;
      position: relative;
      z-index: 2;
      align-items: center;
      justify-content: space-between;
      flex: 0 0 2.9rem;
      gap: .35rem;
      padding: .2rem .45rem;
      border-bottom: 1px solid var(--border);
    }

    h2 { margin: 0; font-size: 1rem; }

    .page-controls { display: flex; align-items: center; gap: .25rem; }
    .page-controls button { padding: .4rem; font-weight: 700; }
    .page-controls svg { display: block; width: 1.25rem; height: 1.25rem; }
    .zoom-level { min-width: 3.3rem; color: var(--muted); font-size: .78rem; text-align: center; }
    .reading-progress { min-width: 3.3rem; color: var(--muted); font-size: .78rem; text-align: center; }
    .page-controls label { color: var(--muted); font-size: .85rem; }
    .page-controls input {
      width: 4.25rem;
      height: 2.5rem;
      padding: .35rem;
      border: 1px solid var(--border);
      border-radius: .4rem;
      color: var(--text);
      background: var(--surface);
      text-align: center;
    }

    .highlight-controls { display: flex; align-items: center; gap: .2rem; }
    .highlight-tool {
      position: relative;
      min-width: 2.5rem;
      padding: .35rem .45rem;
      border-color: var(--border);
      display: grid;
      place-items: center;
    }
    .highlight-tool svg { width: 1.35rem; height: 1.35rem; }
    .highlight-tool .color-swatch { fill: rgb(255 225 70 / 55%); stroke: rgb(151 124 0 / 55%); }
    .highlight-tool[data-tool="dark"] .color-swatch { fill: rgb(244 174 0 / 82%); stroke: rgb(139 91 0 / 70%); }
    .highlight-tool[data-tool="eraser"] svg { color: var(--muted); }
    .highlight-tool[aria-pressed="true"] { box-shadow: inset 0 0 0 2px white; }
    .intensity-settings { position: relative; }
    .intensity-toggle svg { color: #d6a900; }
    .intensity-menu {
      position: absolute;
      z-index: 10;
      top: calc(100% + .35rem);
      left: 50%;
      display: grid;
      width: max-content;
      gap: .5rem;
      padding: .55rem .65rem;
      border: 1px solid var(--border);
      border-radius: .55rem;
      color: var(--text);
      background: var(--surface);
      box-shadow: var(--shadow);
      transform: translateX(-50%);
    }
    .intensity-menu[hidden] { display: none; }
    .intensity-row { display: grid; grid-template-columns: 5.4rem 3rem 8rem 3.2rem; align-items: center; gap: .35rem; }
    .intensity-row label { font-size: .78rem; font-weight: 650; text-align: left; }
    .intensity-row span { color: var(--muted); font-size: .68rem; }
    .intensity-row input { width: 8rem; accent-color: #d6a900; }

    .viewer {
      display: block;
      position: relative;
      flex: 1 1 0;
      height: 0;
      width: 100%;
      min-height: 0;
      overflow: auto;
      padding: .35rem;
      overscroll-behavior: contain;
      background: #525659;
      text-align: center;
    }

    .page-surface {
      position: relative;
      width: max-content;
      margin: 0 auto;
      box-shadow: 0 3px 14px rgb(0 0 0 / 35%);
    }

    .viewer canvas {
      display: block;
      background: white;
    }

    .viewer .highlight-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      box-shadow: none;
      pointer-events: none;
    }

    .viewer.highlighting .highlight-layer {
      cursor: crosshair;
      pointer-events: auto;
      touch-action: none;
    }

    .viewer-status {
      position: absolute;
      inset: 50% auto auto 50%;
      margin: 0;
      padding: .65rem .85rem;
      border-radius: .45rem;
      color: white;
      background: rgb(25 27 28 / 88%);
      transform: translate(-50%, -50%);
    }

    .viewer-status[hidden] { display: none; }

    .view-options { position: relative; }
    .view-options > button { padding: .4rem; }
    .view-menu {
      position: absolute;
      z-index: 10;
      top: calc(100% + .3rem);
      right: 0;
      display: grid;
      width: max-content;
      min-width: 12rem;
      gap: .2rem;
      padding: .35rem;
      border: 1px solid var(--border);
      border-radius: .55rem;
      background: var(--surface);
      box-shadow: var(--shadow);
    }
    .view-menu[hidden] { display: none; }
    .view-menu button { color: var(--text); background: transparent; text-align: left; }
    .view-menu button:hover { background: rgb(49 91 75 / 10%); }

    main.reversed .document:first-child { order: 2; }
    main.reversed .document:last-child { order: 1; }

    @media (max-width: 1200px) {
      .document-header {
        flex-basis: 1.4rem;
        min-height: 0;
        gap: .1rem;
        padding: .08rem .2rem;
      }
      h2 { font-size: .68rem; line-height: 1; white-space: nowrap; }
      .page-controls { gap: .08rem; }
      .page-controls button {
        min-width: 1.2rem;
        min-height: 1.2rem;
        height: 1.2rem;
        padding: .12rem;
        border-radius: .25rem;
        font-size: .62rem;
        line-height: 1;
      }
      .page-controls svg { width: .72rem; height: .72rem; }
      .zoom-level { min-width: 2rem; font-size: .58rem; }
      .reading-progress { min-width: 2rem; font-size: .58rem; }
      .page-controls label { font-size: 0; }
      .page-controls input {
        width: 2.25rem;
        height: 1.2rem;
        padding: .05rem;
        border-radius: .25rem;
        font-size: .62rem;
      }
      .highlight-controls { gap: .08rem; }
      .highlight-tool {
        min-width: 1.2rem;
        min-height: 1.2rem;
        height: 1.2rem;
        padding: .05rem .18rem;
        border-radius: .25rem;
        font-size: 0;
      }
      .highlight-tool svg { width: .85rem; height: .85rem; }
      .viewer { padding: .15rem; }
    }

    @media (max-width: 760px) {
      main {
        grid-template-columns: minmax(0, 1fr);
        grid-template-rows: repeat(2, minmax(0, 1fr));
      }
      h2 { font-size: .64rem; }
    }
  </style>
</head>

  <script type="module">
    import * as pdfjsLib from "./vendor/pdfjs/pdf.min.mjs";

    pdfjsLib.GlobalWorkerOptions.workerSrc = "./vendor/pdfjs/pdf.worker.min.mjs";

    const repositoryRawUrl = "https://raw.githubusercontent.com/tometchy/Bog-zachowal-swoj-Tekst-Wilbur-Pickering/master/";
    const documents = {
      english: repositoryRawUrl + "God-Has-Preserved-His-Text-4th.pdf",
      polish: repositoryRawUrl + "build/pdf/Bog-zachowal-swoj-Tekst-Wilbur-Pickering.pdf"
    };
    const storagePrefix = "pdf-comparison:";

    function savedValue(key, fallback) {
      try { return localStorage.getItem(storagePrefix + key) || fallback; }
      catch (_) { return fallback; }
    }

    function saveValue(key, value) {
      try { localStorage.setItem(storagePrefix + key, value); }
      catch (_) { /* Porównywarka działa również przy wyłączonym localStorage. */ }
    }

    const previousIntensity = savedValue("highlight-intensity", "65");
    const highlightIntensities = {
      light: Math.min(100, Math.max(10, Number(savedValue("highlight-intensity:light", previousIntensity)) || 65)),
      dark: Math.min(100, Math.max(10, Number(savedValue("highlight-intensity:dark", previousIntensity)) || 65))
    };

    function setHighlightIntensity(marker, value) {
      highlightIntensities[marker] = Math.min(100, Math.max(10, Number(value) || 65));
      saveValue("highlight-intensity:" + marker, String(highlightIntensities[marker]));
      document.querySelectorAll(`.highlight-intensity[data-marker="${marker}"]`).forEach((input) => {
        input.value = String(highlightIntensities[marker]);
      });
      document.dispatchEvent(new CustomEvent("highlight-intensity-change"));
    }

    document.querySelectorAll(".highlight-intensity").forEach((input) => {
      input.value = String(highlightIntensities[input.dataset.marker]);
      input.addEventListener("input", () => setHighlightIntensity(input.dataset.marker, input.value));
      input.addEventListener("click", (event) => event.stopPropagation());
    });

    document.querySelectorAll(".intensity-toggle").forEach((toggle) => {
      toggle.addEventListener("click", (event) => {
        event.stopPropagation();
        const menu = toggle.nextElementSibling;
        const willOpen = menu.hidden;
        closeMenus(menu);
        menu.hidden = !willOpen;
        toggle.setAttribute("aria-expanded", String(willOpen));
      });
    });

    document.querySelectorAll(".document").forEach(async (panel) => {
      const name = panel.dataset.document;
      const input = panel.querySelector(".page");
      const viewer = panel.querySelector(".viewer");
      const canvas = panel.querySelector(".pdf-layer");
      const highlightLayer = panel.querySelector(".highlight-layer");
      const highlightButtons = panel.querySelectorAll(".highlight-tool[data-tool]");
      const status = panel.querySelector(".viewer-status");
      const previous = panel.querySelector(".previous");
      const next = panel.querySelector(".next");
      const zoomOut = panel.querySelector(".zoom-out");
      const zoomIn = panel.querySelector(".zoom-in");
      const refresh = panel.querySelector(".refresh");
      const zoomLevel = panel.querySelector(".zoom-level");
      const readingProgress = panel.querySelector(".reading-progress");
      let pdf;
      let loadGeneration = 0;
      let renderTask;
      let renderGeneration = 0;
      let resizeTimer;
      let scrollTimer;
      let activeTool;
      let activeStroke;
      let zoom = Math.min(3, Math.max(.5, Number(savedValue(name + ":zoom", "1")) || 1));

      function highlightStorageKey(pageNumber) {
        return storagePrefix + name + ":highlights:" + pageNumber;
      }

      function getHighlights(pageNumber) {
        try {
          const highlights = JSON.parse(localStorage.getItem(highlightStorageKey(pageNumber)) || "[]");
          return Array.isArray(highlights) ? highlights : [];
        } catch (_) {
          return [];
        }
      }

      function saveHighlights(pageNumber, highlights) {
        try { localStorage.setItem(highlightStorageKey(pageNumber), JSON.stringify(highlights)); }
        catch (_) { /* Zakreślanie działa do czasu odświeżenia również bez localStorage. */ }
      }

      function drawHighlights(highlights = getHighlights(Number(input.value))) {
        const context = highlightLayer.getContext("2d");
        const width = highlightLayer.width;
        const height = highlightLayer.height;
        context.clearRect(0, 0, width, height);
        context.lineCap = "round";
        context.lineJoin = "round";

        highlights.forEach((stroke) => {
          if (!Array.isArray(stroke.points) || !stroke.points.length) return;
          context.beginPath();
          const intensity = highlightIntensities[stroke.tool === "dark" ? "dark" : "light"];
          const darkness = ((intensity - 10) / 90) ** 2;
          const opacity = .2 + darkness * .8;
          const lightness = stroke.tool === "dark" ? 55 - darkness * 32 : 78 - darkness * 43;
          context.strokeStyle = `hsla(${stroke.tool === "dark" ? 42 : 50}, 100%, ${lightness}%, ${opacity})`;
          context.lineWidth = Math.max(1, width * .013);
          stroke.points.forEach((point, index) => {
            const x = point[0] * width;
            const y = point[1] * height;
            if (index) context.lineTo(x, y);
            else context.moveTo(x, y);
          });
          if (stroke.points.length === 1) {
            const point = stroke.points[0];
            context.lineTo(point[0] * width + .01, point[1] * height);
          }
          context.stroke();
        });
      }

      function setHighlightTool(tool) {
        activeTool = activeTool === tool ? undefined : tool;
        viewer.classList.toggle("highlighting", Boolean(activeTool));
        highlightButtons.forEach((button) => {
          button.setAttribute("aria-pressed", String(button.dataset.tool === activeTool));
        });
      }

      function highlightPoint(event) {
        const rectangle = highlightLayer.getBoundingClientRect();
        return [
          Math.min(1, Math.max(0, (event.clientX - rectangle.left) / rectangle.width)),
          Math.min(1, Math.max(0, (event.clientY - rectangle.top) / rectangle.height))
        ];
      }

      highlightButtons.forEach((button) => {
        button.addEventListener("click", () => setHighlightTool(button.dataset.tool));
      });

      function distanceToSegment(point, start, end) {
        const lengthSquared = (end[0] - start[0]) ** 2 + (end[1] - start[1]) ** 2;
        if (!lengthSquared) return Math.hypot(point[0] - start[0], point[1] - start[1]);
        const position = Math.max(0, Math.min(1,
          ((point[0] - start[0]) * (end[0] - start[0]) + (point[1] - start[1]) * (end[1] - start[1])) / lengthSquared
        ));
        return Math.hypot(
          point[0] - (start[0] + position * (end[0] - start[0])),
          point[1] - (start[1] + position * (end[1] - start[1]))
        );
      }

      function eraseAt(event) {
        const rectangle = highlightLayer.getBoundingClientRect();
        const point = [event.clientX - rectangle.left, event.clientY - rectangle.top];
        const radius = 18;
        const highlights = getHighlights(Number(input.value));
        const remaining = highlights.filter((stroke) => {
          const points = stroke.points.map(([x, y]) => [x * rectangle.width, y * rectangle.height]);
          if (points.length === 1) return distanceToSegment(point, points[0], points[0]) > radius;
          return !points.some((current, index) => index && distanceToSegment(point, points[index - 1], current) <= radius);
        });
        if (remaining.length !== highlights.length) {
          saveHighlights(Number(input.value), remaining);
          drawHighlights(remaining);
        }
      }

      highlightLayer.addEventListener("pointerdown", (event) => {
        if (!activeTool || event.button > 0) return;
        event.preventDefault();
        highlightLayer.setPointerCapture(event.pointerId);
        if (activeTool === "eraser") {
          eraseAt(event);
          return;
        }
        activeStroke = { tool: activeTool, points: [highlightPoint(event)] };
        const highlights = getHighlights(Number(input.value));
        highlights.push(activeStroke);
        drawHighlights(highlights);
      });

      highlightLayer.addEventListener("pointermove", (event) => {
        if (!highlightLayer.hasPointerCapture(event.pointerId)) return;
        event.preventDefault();
        if (activeTool === "eraser") {
          eraseAt(event);
          return;
        }
        if (!activeStroke) return;
        activeStroke.points.push(highlightPoint(event));
        const highlights = getHighlights(Number(input.value));
        highlights.push(activeStroke);
        drawHighlights(highlights);
      });

      function finishHighlight(event) {
        if (highlightLayer.hasPointerCapture(event.pointerId)) highlightLayer.releasePointerCapture(event.pointerId);
        if (!activeStroke) return;
        const highlights = getHighlights(Number(input.value));
        highlights.push(activeStroke);
        saveHighlights(Number(input.value), highlights);
        activeStroke = undefined;
        drawHighlights(highlights);
      }

      highlightLayer.addEventListener("pointerup", finishHighlight);
      highlightLayer.addEventListener("pointercancel", finishHighlight);
      document.addEventListener("highlight-intensity-change", () => drawHighlights());

      function updateZoomControls() {
        zoomLevel.textContent = Math.round(zoom * 100) + "%";
        zoomOut.disabled = zoom <= .5;
        zoomIn.disabled = zoom >= 3;
      }

      function saveScrollPosition() {
        const maxLeft = Math.max(0, viewer.scrollWidth - viewer.clientWidth);
        const maxTop = Math.max(0, viewer.scrollHeight - viewer.clientHeight);
        saveValue(name + ":scroll-left", String(viewer.scrollLeft));
        saveValue(name + ":scroll-top", String(viewer.scrollTop));
        saveValue(name + ":scroll-max-left", String(maxLeft));
        saveValue(name + ":scroll-max-top", String(maxTop));
        saveValue(name + ":scroll-left-ratio", String(maxLeft ? viewer.scrollLeft / maxLeft : 0));
        saveValue(name + ":scroll-top-ratio", String(maxTop ? viewer.scrollTop / maxTop : 0));
      }

      function restoreScrollPosition() {
        const maxLeft = Math.max(0, viewer.scrollWidth - viewer.clientWidth);
        const maxTop = Math.max(0, viewer.scrollHeight - viewer.clientHeight);
        const savedLeft = Number(savedValue(name + ":scroll-left", "0")) || 0;
        const savedTop = Number(savedValue(name + ":scroll-top", "0")) || 0;
        const savedMaxLeft = Number(savedValue(name + ":scroll-max-left", "0")) || 0;
        const savedMaxTop = Number(savedValue(name + ":scroll-max-top", "0")) || 0;
        const leftRatio = Number(savedValue(name + ":scroll-left-ratio", "0")) || 0;
        const topRatio = Number(savedValue(name + ":scroll-top-ratio", "0")) || 0;

        viewer.scrollLeft = Math.min(maxLeft, savedMaxLeft === maxLeft ? savedLeft : maxLeft * leftRatio);
        viewer.scrollTop = Math.min(maxTop, savedMaxTop === maxTop ? savedTop : maxTop * topRatio);
      }

      async function renderPage(pageNumber, restoreSavedScroll = false) {
        if (!pdf) return;
        const generation = ++renderGeneration;
        if (renderTask) renderTask.cancel();

        const page = await pdf.getPage(pageNumber);
        if (generation !== renderGeneration) return;
        const unscaledViewport = page.getViewport({ scale: 1 });
        const availableWidth = Math.max(200, viewer.clientWidth - 12);
        const availableHeight = Math.max(200, viewer.clientHeight - 12);
        const fitScale = Math.min(
          availableWidth / unscaledViewport.width,
          availableHeight / unscaledViewport.height
        );
        const cssScale = fitScale * zoom;
        const pixelRatio = window.devicePixelRatio || 1;
        const viewport = page.getViewport({ scale: cssScale * pixelRatio });

        canvas.width = Math.floor(viewport.width);
        canvas.height = Math.floor(viewport.height);
        canvas.style.width = Math.floor(viewport.width / pixelRatio) + "px";
        canvas.style.height = Math.floor(viewport.height / pixelRatio) + "px";
        highlightLayer.width = canvas.width;
        highlightLayer.height = canvas.height;
        highlightLayer.style.width = canvas.style.width;
        highlightLayer.style.height = canvas.style.height;

        const task = page.render({ canvasContext: canvas.getContext("2d"), viewport });
        renderTask = task;
        try {
          await task.promise;
          if (generation !== renderGeneration) return;
          canvas.dataset.page = String(pageNumber);
          highlightLayer.dataset.page = String(pageNumber);
          drawHighlights(getHighlights(pageNumber));
          status.hidden = true;
          if (restoreSavedScroll) {
            requestAnimationFrame(restoreScrollPosition);
            setTimeout(restoreScrollPosition, 250);
          }
        } catch (error) {
          if (error?.name !== "RenderingCancelledException") throw error;
        } finally {
          if (renderTask === task) renderTask = null;
        }
      }

      function showPage(value, restoreSavedScroll = false) {
        const lastPage = pdf?.numPages || Number.MAX_SAFE_INTEGER;
        const page = Math.min(lastPage, Math.max(1, Math.floor(Number(value) || 1)));
        if (!restoreSavedScroll && page !== Number(input.value)) {
          viewer.scrollLeft = 0;
          viewer.scrollTop = 0;
          saveScrollPosition();
        }
        input.value = page;
        saveValue(name + ":page", String(page));
        previous.disabled = page === 1;
        next.disabled = pdf ? page === pdf.numPages : false;
        if (pdf) {
          const percentage = Math.round(page / pdf.numPages * 100);
          readingProgress.textContent = percentage + "%";
          readingProgress.setAttribute("aria-label", "Przeczytano " + percentage + "% dokumentu");
        }
        renderPage(page, restoreSavedScroll).catch(showError);
      }

      function showError(error) {
        console.error(error);
        status.hidden = false;
        status.textContent = "Nie udało się wczytać PDF-u. Sprawdź połączenie z internetem i odśwież stronę.";
      }

      previous.addEventListener("click", () => showPage(Number(input.value) - 1));
      next.addEventListener("click", () => showPage(Number(input.value) + 1));
      zoomOut.addEventListener("click", () => setZoom(zoom - .1));
      zoomIn.addEventListener("click", () => setZoom(zoom + .1));
      refresh.addEventListener("click", () => loadPdf(true));
      input.addEventListener("change", () => showPage(input.value));
      input.addEventListener("keydown", (event) => {
        if (event.key === "Enter") showPage(input.value);
      });
      viewer.addEventListener("scroll", () => {
        clearTimeout(scrollTimer);
        scrollTimer = setTimeout(saveScrollPosition, 50);
      }, { passive: true });
      window.addEventListener("pagehide", saveScrollPosition);
      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "hidden") saveScrollPosition();
      });

      function setZoom(value) {
        zoom = Math.min(3, Math.max(.5, Math.round(value * 10) / 10));
        saveValue(name + ":zoom", String(zoom));
        updateZoomControls();
        renderPage(Number(input.value)).catch(showError);
      }

      async function loadPdf(forceRefresh = false) {
        const generation = ++loadGeneration;
        const currentPage = input.value || savedValue(name + ":page", "1");
        refresh.disabled = true;
        status.hidden = false;
        status.textContent = forceRefresh ? "Odświeżanie dokumentu…" : "Wczytywanie dokumentu…";

        try {
          if (renderTask) {
            renderTask.cancel();
            renderTask = null;
          }
          if (pdf) {
            await pdf.destroy();
            pdf = undefined;
          }
          const cacheBuster = forceRefresh ? (documents[name].includes("?") ? "&" : "?") + "refresh=" + Date.now() : "";
          const loadedPdf = await pdfjsLib.getDocument(documents[name] + cacheBuster).promise;
          if (generation !== loadGeneration) {
            await loadedPdf.destroy();
            return;
          }
          pdf = loadedPdf;
          input.max = pdf.numPages;
          updateZoomControls();
          showPage(currentPage, true);
        } catch (error) {
          if (generation === loadGeneration) showError(error);
        } finally {
          if (generation === loadGeneration) refresh.disabled = false;
        }
      }

      new ResizeObserver(() => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => renderPage(Number(input.value), true).catch(showError), 150);
      }).observe(viewer);

      await loadPdf();
    });

    const main = document.querySelector("main");

    function setLayout(layout) {
      const stacked = layout === "stacked";
      main.classList.toggle("stacked", stacked);
      saveValue("layout", stacked ? "stacked" : "side-by-side");
    }

    function closeMenus(except) {
      document.querySelectorAll(".view-menu, .intensity-menu").forEach((menu) => {
        if (menu === except) return;
        menu.hidden = true;
        menu.previousElementSibling.setAttribute("aria-expanded", "false");
      });
    }

    document.querySelectorAll(".view-options-toggle").forEach((toggle) => {
      toggle.addEventListener("click", (event) => {
        event.stopPropagation();
        const menu = toggle.nextElementSibling;
        const willOpen = menu.hidden;
        closeMenus(menu);
        menu.hidden = !willOpen;
        toggle.setAttribute("aria-expanded", String(willOpen));
      });
    });

    document.querySelectorAll(".view-menu button").forEach((button) => {
      button.addEventListener("click", () => {
        if (button.dataset.action === "swap") {
          const reversed = !main.classList.contains("reversed");
          main.classList.toggle("reversed", reversed);
          saveValue("order", reversed ? "reversed" : "normal");
        } else {
          setLayout(button.dataset.action);
        }
        closeMenus();
      });
    });

    document.addEventListener("click", () => closeMenus());
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") closeMenus();
    });

    setLayout(savedValue("layout", "side-by-side"));
    main.classList.toggle("reversed", savedValue("order", "normal") === "reversed");
  </script>
</body>
</html>
