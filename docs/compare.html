<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Porównanie wydania angielskiego i polskiego</title>
  <style>
    :root {
      color-scheme: light;
      --background: #f4f1ea;
      --surface: #fffdf8;
      --text: #24221f;
      --muted: #6c665d;
      --border: #d6d0c5;
      --accent: #315b4b;
      --accent-hover: #244538;
      --shadow: 0 8px 24px rgb(53 47 38 / 10%);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-width: 320px;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      color: var(--text);
      background: var(--background);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    button, input { font: inherit; }

    button {
      min-width: 2.5rem;
      min-height: 2.5rem;
      padding: .35rem .65rem;
      border: 1px solid transparent;
      border-radius: .45rem;
      color: var(--text);
      background: transparent;
      cursor: pointer;
    }

    button:hover { background: rgb(49 91 75 / 10%); }
    button[aria-pressed="true"], .page-controls button {
      color: white;
      background: var(--accent);
    }
    button[aria-pressed="true"]:hover, .page-controls button:hover { background: var(--accent-hover); }
    button:focus-visible, input:focus-visible { outline: 3px solid rgb(49 91 75 / 35%); outline-offset: 2px; }

    main {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      grid-template-rows: minmax(0, 1fr);
      gap: .4rem;
      height: 100vh;
      height: 100dvh;
      padding: .4rem;
    }

    main.stacked {
      grid-template-columns: minmax(0, 1fr);
      grid-template-rows: repeat(2, minmax(0, 1fr));
    }

    .document {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;
      overflow: visible;
      border: 1px solid var(--border);
      border-radius: .8rem;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .document-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex: 0 0 2.9rem;
      gap: .35rem;
      padding: .2rem .45rem;
      border-bottom: 1px solid var(--border);
    }

    h2 { margin: 0; font-size: 1rem; }

    .page-controls { display: flex; align-items: center; gap: .25rem; }
    .page-controls button { padding: .4rem; font-weight: 700; }
    .page-controls svg { display: block; width: 1.25rem; height: 1.25rem; }
    .zoom-level { min-width: 3.3rem; color: var(--muted); font-size: .78rem; text-align: center; }
    .page-controls label { color: var(--muted); font-size: .85rem; }
    .page-controls input {
      width: 4.25rem;
      height: 2.5rem;
      padding: .35rem;
      border: 1px solid var(--border);
      border-radius: .4rem;
      color: var(--text);
      background: var(--surface);
      text-align: center;
    }

    .viewer {
      display: block;
      position: relative;
      flex: 1 1 auto;
      width: 100%;
      min-height: 0;
      overflow: auto;
      padding: .35rem;
      overscroll-behavior: contain;
      background: #525659;
      text-align: center;
    }

    .viewer canvas {
      display: block;
      margin: 0 auto;
      background: white;
      box-shadow: 0 3px 14px rgb(0 0 0 / 35%);
    }

    .viewer-status {
      position: absolute;
      inset: 50% auto auto 50%;
      margin: 0;
      padding: .65rem .85rem;
      border-radius: .45rem;
      color: white;
      background: rgb(25 27 28 / 88%);
      transform: translate(-50%, -50%);
    }

    .viewer-status[hidden] { display: none; }

    .view-options { position: relative; }
    .view-options > button { padding: .4rem; }
    .view-menu {
      position: absolute;
      z-index: 10;
      top: calc(100% + .3rem);
      right: 0;
      display: grid;
      width: max-content;
      min-width: 12rem;
      gap: .2rem;
      padding: .35rem;
      border: 1px solid var(--border);
      border-radius: .55rem;
      background: var(--surface);
      box-shadow: var(--shadow);
    }
    .view-menu[hidden] { display: none; }
    .view-menu button { color: var(--text); background: transparent; text-align: left; }
    .view-menu button:hover { background: rgb(49 91 75 / 10%); }

    main.reversed .document:first-child { order: 2; }
    main.reversed .document:last-child { order: 1; }

    @media (max-width: 1200px) {
      .document-header {
        flex-basis: 2.55rem;
        gap: .2rem;
        padding: .15rem .35rem;
      }
      h2 { font-size: .88rem; white-space: nowrap; }
      .page-controls { gap: .15rem; }
      .page-controls button {
        min-width: 2.2rem;
        min-height: 2.2rem;
        padding: .3rem;
      }
      .page-controls svg { width: 1.1rem; height: 1.1rem; }
      .zoom-level { min-width: 2.8rem; font-size: .72rem; }
      .page-controls label { font-size: 0; }
      .page-controls input { width: 3.1rem; height: 2.2rem; font-size: .8rem; }
    }

    @media (max-width: 760px) {
      main {
        grid-template-columns: minmax(0, 1fr);
        grid-template-rows: repeat(2, minmax(0, 1fr));
      }
      .document-header { flex-basis: 2.35rem; padding-inline: .3rem; }
      h2 { font-size: .8rem; }
      .page-controls button { min-width: 2.05rem; min-height: 2.05rem; }
      .page-controls svg { width: 1rem; height: 1rem; }
      .zoom-level { min-width: 2.55rem; font-size: .68rem; }
      .page-controls input { width: 2.8rem; height: 2.05rem; font-size: .78rem; }
    }
  </style>
</head>
<body>
  <main id="documents">
    <section class="document" data-document="english">
      <div class="document-header">
        <h2>Oryginał angielski</h2>
        <div class="page-controls">
          <button class="zoom-out" type="button" aria-label="Pomniejsz dokument angielski" title="Pomniejsz">
            <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M15.5 15.5 21 21M7.5 10.5h6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          </button>
          <span class="zoom-level" aria-live="polite">100%</span>
          <button class="zoom-in" type="button" aria-label="Powiększ dokument angielski" title="Powiększ">
            <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M15.5 15.5 21 21M7.5 10.5h6M10.5 7.5v6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          </button>
          <div class="view-options">
            <button class="view-options-toggle" type="button" aria-label="Układ i kolejność dokumentów" aria-haspopup="true" aria-expanded="false" title="Układ i kolejność">
              <svg aria-hidden="true" viewBox="0 0 24 24"><rect x="2.5" y="4" width="7" height="12" rx="1.5" fill="none" stroke="currentColor" stroke-width="2"/><rect x="14.5" y="8" width="7" height="12" rx="1.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="m10.5 5 2-2 2 2M13.5 19l-2 2-2-2" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <div class="view-menu" hidden>
              <button type="button" data-action="side-by-side">Ustaw obok siebie</button>
              <button type="button" data-action="stacked">Ustaw jeden nad drugim</button>
              <button type="button" data-action="swap">Zamień dokumenty miejscami</button>
            </div>
          </div>
          <button class="previous" type="button" aria-label="Poprzednia strona dokumentu angielskiego">−</button>
          <label>Strona <input class="page" type="number" min="1" step="1" inputmode="numeric" aria-label="Numer strony dokumentu angielskiego"></label>
          <button class="next" type="button" aria-label="Następna strona dokumentu angielskiego">+</button>
        </div>
      </div>
      <div class="viewer" role="region" aria-label="Angielskie wydanie książki">
        <canvas aria-label="Bieżąca strona angielskiego wydania"></canvas>
        <p class="viewer-status" role="status">Wczytywanie dokumentu…</p>
      </div>
    </section>

    <section class="document" data-document="polish">
      <div class="document-header">
        <h2>Tłumaczenie polskie</h2>
        <div class="page-controls">
          <button class="zoom-out" type="button" aria-label="Pomniejsz dokument polski" title="Pomniejsz">
            <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M15.5 15.5 21 21M7.5 10.5h6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          </button>
          <span class="zoom-level" aria-live="polite">100%</span>
          <button class="zoom-in" type="button" aria-label="Powiększ dokument polski" title="Powiększ">
            <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M15.5 15.5 21 21M7.5 10.5h6M10.5 7.5v6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          </button>
          <div class="view-options">
            <button class="view-options-toggle" type="button" aria-label="Układ i kolejność dokumentów" aria-haspopup="true" aria-expanded="false" title="Układ i kolejność">
              <svg aria-hidden="true" viewBox="0 0 24 24"><rect x="2.5" y="4" width="7" height="12" rx="1.5" fill="none" stroke="currentColor" stroke-width="2"/><rect x="14.5" y="8" width="7" height="12" rx="1.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="m10.5 5 2-2 2 2M13.5 19l-2 2-2-2" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <div class="view-menu" hidden>
              <button type="button" data-action="side-by-side">Ustaw obok siebie</button>
              <button type="button" data-action="stacked">Ustaw jeden nad drugim</button>
              <button type="button" data-action="swap">Zamień dokumenty miejscami</button>
            </div>
          </div>
          <button class="previous" type="button" aria-label="Poprzednia strona dokumentu polskiego">−</button>
          <label>Strona <input class="page" type="number" min="1" step="1" inputmode="numeric" aria-label="Numer strony dokumentu polskiego"></label>
          <button class="next" type="button" aria-label="Następna strona dokumentu polskiego">+</button>
        </div>
      </div>
      <div class="viewer" role="region" aria-label="Polskie wydanie książki">
        <canvas aria-label="Bieżąca strona polskiego wydania"></canvas>
        <p class="viewer-status" role="status">Wczytywanie dokumentu…</p>
      </div>
    </section>
  </main>

  <script type="module">
    import * as pdfjsLib from "./vendor/pdfjs/pdf.min.mjs";

    pdfjsLib.GlobalWorkerOptions.workerSrc = "./vendor/pdfjs/pdf.worker.min.mjs";

    const repositoryRawUrl = "https://raw.githubusercontent.com/tometchy/Bog-zachowal-swoj-Tekst-Wilbur-Pickering/master/";
    const documents = {
      english: repositoryRawUrl + "God-Has-Preserved-His-Text-4th.pdf",
      polish: repositoryRawUrl + "build/pdf/Bog-zachowal-swoj-Tekst-Wilbur-Pickering.pdf"
    };
    const storagePrefix = "pdf-comparison:";

    function savedValue(key, fallback) {
      try { return localStorage.getItem(storagePrefix + key) || fallback; }
      catch (_) { return fallback; }
    }

    function saveValue(key, value) {
      try { localStorage.setItem(storagePrefix + key, value); }
      catch (_) { /* Porównywarka działa również przy wyłączonym localStorage. */ }
    }

    document.querySelectorAll(".document").forEach(async (panel) => {
      const name = panel.dataset.document;
      const input = panel.querySelector(".page");
      const viewer = panel.querySelector(".viewer");
      const canvas = panel.querySelector("canvas");
      const status = panel.querySelector(".viewer-status");
      const previous = panel.querySelector(".previous");
      const next = panel.querySelector(".next");
      const zoomOut = panel.querySelector(".zoom-out");
      const zoomIn = panel.querySelector(".zoom-in");
      const zoomLevel = panel.querySelector(".zoom-level");
      let pdf;
      let renderTask;
      let renderGeneration = 0;
      let resizeTimer;
      let scrollTimer;
      let zoom = Math.min(3, Math.max(.5, Number(savedValue(name + ":zoom", "1")) || 1));

      function updateZoomControls() {
        zoomLevel.textContent = Math.round(zoom * 100) + "%";
        zoomOut.disabled = zoom <= .5;
        zoomIn.disabled = zoom >= 3;
      }

      function saveScrollPosition() {
        const maxLeft = Math.max(0, viewer.scrollWidth - viewer.clientWidth);
        const maxTop = Math.max(0, viewer.scrollHeight - viewer.clientHeight);
        saveValue(name + ":scroll-left", String(viewer.scrollLeft));
        saveValue(name + ":scroll-top", String(viewer.scrollTop));
        saveValue(name + ":scroll-max-left", String(maxLeft));
        saveValue(name + ":scroll-max-top", String(maxTop));
        saveValue(name + ":scroll-left-ratio", String(maxLeft ? viewer.scrollLeft / maxLeft : 0));
        saveValue(name + ":scroll-top-ratio", String(maxTop ? viewer.scrollTop / maxTop : 0));
      }

      function restoreScrollPosition() {
        const maxLeft = Math.max(0, viewer.scrollWidth - viewer.clientWidth);
        const maxTop = Math.max(0, viewer.scrollHeight - viewer.clientHeight);
        const savedLeft = Number(savedValue(name + ":scroll-left", "0")) || 0;
        const savedTop = Number(savedValue(name + ":scroll-top", "0")) || 0;
        const savedMaxLeft = Number(savedValue(name + ":scroll-max-left", "0")) || 0;
        const savedMaxTop = Number(savedValue(name + ":scroll-max-top", "0")) || 0;
        const leftRatio = Number(savedValue(name + ":scroll-left-ratio", "0")) || 0;
        const topRatio = Number(savedValue(name + ":scroll-top-ratio", "0")) || 0;

        viewer.scrollLeft = Math.min(maxLeft, savedMaxLeft === maxLeft ? savedLeft : maxLeft * leftRatio);
        viewer.scrollTop = Math.min(maxTop, savedMaxTop === maxTop ? savedTop : maxTop * topRatio);
      }

      async function renderPage(pageNumber, restoreSavedScroll = false) {
        if (!pdf) return;
        const generation = ++renderGeneration;
        if (renderTask) renderTask.cancel();

        const page = await pdf.getPage(pageNumber);
        if (generation !== renderGeneration) return;
        const unscaledViewport = page.getViewport({ scale: 1 });
        const availableWidth = Math.max(200, viewer.clientWidth - 12);
        const availableHeight = Math.max(200, viewer.clientHeight - 12);
        const fitScale = Math.min(
          availableWidth / unscaledViewport.width,
          availableHeight / unscaledViewport.height
        );
        const cssScale = fitScale * zoom;
        const pixelRatio = window.devicePixelRatio || 1;
        const viewport = page.getViewport({ scale: cssScale * pixelRatio });

        canvas.width = Math.floor(viewport.width);
        canvas.height = Math.floor(viewport.height);
        canvas.style.width = Math.floor(viewport.width / pixelRatio) + "px";
        canvas.style.height = Math.floor(viewport.height / pixelRatio) + "px";

        const task = page.render({ canvasContext: canvas.getContext("2d"), viewport });
        renderTask = task;
        try {
          await task.promise;
          if (generation !== renderGeneration) return;
          canvas.dataset.page = String(pageNumber);
          status.hidden = true;
          if (restoreSavedScroll) {
            requestAnimationFrame(restoreScrollPosition);
            setTimeout(restoreScrollPosition, 250);
          }
        } catch (error) {
          if (error?.name !== "RenderingCancelledException") throw error;
        } finally {
          if (renderTask === task) renderTask = null;
        }
      }

      function showPage(value, restoreSavedScroll = false) {
        const lastPage = pdf?.numPages || Number.MAX_SAFE_INTEGER;
        const page = Math.min(lastPage, Math.max(1, Math.floor(Number(value) || 1)));
        if (!restoreSavedScroll && page !== Number(input.value)) {
          viewer.scrollLeft = 0;
          viewer.scrollTop = 0;
          saveScrollPosition();
        }
        input.value = page;
        saveValue(name + ":page", String(page));
        previous.disabled = page === 1;
        next.disabled = pdf ? page === pdf.numPages : false;
        renderPage(page, restoreSavedScroll).catch(showError);
      }

      function showError(error) {
        console.error(error);
        status.hidden = false;
        status.textContent = "Nie udało się wczytać PDF-u. Sprawdź połączenie z internetem i odśwież stronę.";
      }

      previous.addEventListener("click", () => showPage(Number(input.value) - 1));
      next.addEventListener("click", () => showPage(Number(input.value) + 1));
      zoomOut.addEventListener("click", () => setZoom(zoom - .1));
      zoomIn.addEventListener("click", () => setZoom(zoom + .1));
      input.addEventListener("change", () => showPage(input.value));
      input.addEventListener("keydown", (event) => {
        if (event.key === "Enter") showPage(input.value);
      });
      viewer.addEventListener("scroll", () => {
        clearTimeout(scrollTimer);
        scrollTimer = setTimeout(saveScrollPosition, 50);
      }, { passive: true });
      window.addEventListener("pagehide", saveScrollPosition);
      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "hidden") saveScrollPosition();
      });

      function setZoom(value) {
        zoom = Math.min(3, Math.max(.5, Math.round(value * 10) / 10));
        saveValue(name + ":zoom", String(zoom));
        updateZoomControls();
        renderPage(Number(input.value)).catch(showError);
      }

      try {
        pdf = await pdfjsLib.getDocument(documents[name]).promise;
        input.max = pdf.numPages;
        updateZoomControls();
        showPage(savedValue(name + ":page", "1"), true);

        new ResizeObserver(() => {
          clearTimeout(resizeTimer);
          resizeTimer = setTimeout(() => renderPage(Number(input.value), true).catch(showError), 150);
        }).observe(viewer);
      } catch (error) {
        showError(error);
      }
    });

    const main = document.querySelector("main");

    function setLayout(layout) {
      const stacked = layout === "stacked";
      main.classList.toggle("stacked", stacked);
      saveValue("layout", stacked ? "stacked" : "side-by-side");
    }

    function closeMenus(except) {
      document.querySelectorAll(".view-menu").forEach((menu) => {
        if (menu === except) return;
        menu.hidden = true;
        menu.previousElementSibling.setAttribute("aria-expanded", "false");
      });
    }

    document.querySelectorAll(".view-options-toggle").forEach((toggle) => {
      toggle.addEventListener("click", (event) => {
        event.stopPropagation();
        const menu = toggle.nextElementSibling;
        const willOpen = menu.hidden;
        closeMenus(menu);
        menu.hidden = !willOpen;
        toggle.setAttribute("aria-expanded", String(willOpen));
      });
    });

    document.querySelectorAll(".view-menu button").forEach((button) => {
      button.addEventListener("click", () => {
        if (button.dataset.action === "swap") {
          const reversed = !main.classList.contains("reversed");
          main.classList.toggle("reversed", reversed);
          saveValue("order", reversed ? "reversed" : "normal");
        } else {
          setLayout(button.dataset.action);
        }
        closeMenus();
      });
    });

    document.addEventListener("click", () => closeMenus());
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") closeMenus();
    });

    setLayout(savedValue("layout", "side-by-side"));
    main.classList.toggle("reversed", savedValue("order", "normal") === "reversed");
  </script>
</body>
</html>
